name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Validate composer.json files
        run: |
          composer validate --strict --no-check-lock
          composer --working-dir=build validate --strict --no-check-lock

      - name: Lint PHP files
        run: |
          php -l scoper.inc.php
          find build/src build/config build/generate.php build/tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Install build tooling
        run: composer --working-dir=build install --no-interaction --prefer-dist --no-progress

      - name: Run generator unit tests
        run: build/vendor/bin/phpunit --configuration build/phpunit.xml.dist

      - name: Validate symbols/*.json
        run: |
          find symbols -name '*.json' -print0 | while IFS= read -r -d '' f; do
            php -r '
              $d = json_decode(file_get_contents($argv[1]), true);
              if (json_last_error() !== JSON_ERROR_NONE) {
                  fwrite(STDERR, "Invalid JSON: {$argv[1]}\n");
                  exit(1);
              }
              if (basename($argv[1]) !== "versions.json" && ! is_array($d)) {
                  fwrite(STDERR, "Expected a JSON array: {$argv[1]}\n");
                  exit(1);
              }
            ' "$f"
          done
